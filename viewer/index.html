<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A.D.A — Knowledge Galaxy</title>
<style>
:root{color-scheme:dark;--cyan:#7deaff;--muted:#56899b;--line:rgba(125,234,255,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;color:#e8fbff;font:14px/1.5 "Segoe UI",system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 8% 12%,#e9fbff 98%,transparent),radial-gradient(1px 1px at 27% 71%,#9bdcff 98%,transparent),radial-gradient(2px 2px at 76% 23%,#fff 98%,transparent),radial-gradient(1px 1px at 92% 81%,#d8f5ff 98%,transparent),radial-gradient(1px 1px at 54% 42%,#fff 98%,transparent),radial-gradient(1px 1px at 42% 18%,#b4e5ff 98%,transparent);background-size:420px 310px;opacity:.65}
header{position:absolute;z-index:4;top:0;left:0;right:0;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(1,5,13,.9),rgba(1,5,13,.42));backdrop-filter:blur(14px)}
.brand{font-size:12px;letter-spacing:.32em;color:#d8faff;font-weight:650}.sub{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px}button{font:inherit;color:var(--cyan);border:1px solid var(--line);background:rgba(5,24,38,.8);border-radius:10px;padding:8px 12px;cursor:pointer}button:hover{border-color:rgba(125,234,255,.65);background:rgba(11,55,75,.75)}button:disabled{opacity:.4;cursor:default}
#galaxy{position:absolute;inset:66px 320px 114px 0;z-index:1}
aside{position:absolute;z-index:3;right:0;top:66px;bottom:114px;width:320px;padding:24px 20px;border-left:1px solid var(--line);background:rgba(2,8,18,.78);backdrop-filter:blur(16px);overflow:auto}
.kicker{font-size:10px;letter-spacing:.24em;color:#4d8b9e;margin-bottom:14px}.group{font-size:10px;color:#4d8b9e;margin-bottom:8px}.title{font-size:18px;font-weight:550;color:#dffaff;margin:0 0 18px}.excerpt{white-space:pre-wrap;overflow-wrap:anywhere;color:rgba(220,249,255,.72);font-size:12px;line-height:1.9}.path{border-top:1px solid var(--line);margin-top:18px;padding-top:12px;color:#477184;font-size:10px;overflow-wrap:anywhere}
footer{position:absolute;z-index:5;bottom:0;left:0;right:0;min-height:114px;padding:12px 24px 10px;border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(1,5,13,.98),rgba(1,5,13,.82));backdrop-filter:blur(18px)}
#answer{max-width:1000px;margin:0 auto 9px;padding:0 6px;color:#effcff;font-size:13px;line-height:1.55;min-height:0}#answer:empty{display:none}
form{max-width:1000px;margin:auto;display:flex;gap:10px;align-items:center;border:1px solid rgba(125,234,255,.28);border-radius:15px;padding:7px 9px;background:#071421;box-shadow:0 0 35px rgba(8,145,178,.07)}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#e8fbff;padding:8px;font:14px "Segoe UI",sans-serif}input::placeholder{color:#426e7d}
#mic{font-size:17px;padding:8px 12px}#status{max-width:1000px;margin:5px auto 0;color:#477c8d;font-size:9px;letter-spacing:.17em}#brainBadge{max-width:1000px;margin:3px auto 0;color:#7deaff;font-size:9px;letter-spacing:.12em;opacity:0;transition:opacity .25s}#brainBadge.visible{opacity:1}
#error{position:absolute;z-index:7;left:24px;bottom:132px;color:#ff9caa;background:rgba(50,5,15,.8);border:1px solid rgba(255,100,130,.3);border-radius:8px;padding:8px 12px;display:none}
@media(max-width:760px){#galaxy{right:0;bottom:180px}aside{display:none}footer{min-height:180px}header{padding:0 12px}.brand{font-size:10px}}
</style>
<script src="/graph-data.js"></script>
<script src="/vendor/3d-force-graph.min.js"></script>
</head>
<body>
<header>
 <div><div class="brand">A.D.A · KNOWLEDGE GALAXY</div><div class="sub" id="count">INDEXING YOUR NOTES</div></div>
 <div class="actions"><button id="handsfree">HANDS FREE OFF</button><button id="voiceToggle" title="Toggle spoken answers">VOICE ON</button><button id="reindex">REINDEX</button></div>
</header>
<div id="galaxy"></div>
<aside><div class="kicker">SOURCE NOTE</div><div id="source"><div class="group">Select a node</div><p class="excerpt">Ask a question about your notes, or select a glowing node to inspect its source.</p></div></aside>
<div id="error"></div>
<footer>
 <div id="answer"></div>
 <form id="ask"><button type="button" id="mic">🎙</button><input id="question" autocomplete="off" placeholder="Ask your notes… or say “remember that…”"><button type="submit" id="send">SEND</button></form>
 <div id="status">LOCAL WHISPER + VOICESTUDIO / PIPER · CONNECTING</div><div id="brainBadge" aria-live="polite"></div>
</footer>
<script>
(() => {
 const $ = id => document.getElementById(id);
 const sessionId = sessionStorage.getItem('ada-galaxy-session') || (crypto.randomUUID ? crypto.randomUUID() : 'galaxy-'+Date.now());
 sessionStorage.setItem('ada-galaxy-session',sessionId);
 let graph, data={nodes:[],links:[]}, selected=null, voiceOn=true, interacted=false, pendingSpeech='', busy=false, statusText='', lastBrainId=null, brainTimer=null;\n const muted=new URLSearchParams(location.search).get('mute')==='1';
 const status = text => { statusText=text; $('status').textContent=text; };
 const error = text => { $('error').textContent=text; $('error').style.display='block'; };
 const clearError = () => $('error').style.display='none';
 const color = group => {let h=0;for(const c of String(group||'notes'))h=(h*31+c.charCodeAt(0))|0;return 'hsl('+Math.abs(h)%360+',85%,68%)';};
 let currentSource=null,playbackContext=null;
 async function playPcm(encoded,sampleRate=24000){
   if(muted||!encoded)return;
   const raw=atob(encoded),view=new DataView(new ArrayBuffer(raw.length));
   for(let i=0;i<raw.length;i++)view.setUint8(i,raw.charCodeAt(i));
   const count=Math.floor(raw.length/2),audio=new Float32Array(count);
   for(let i=0;i<count;i++)audio[i]=view.getInt16(i*2,true)/32768;
   const context=new (window.AudioContext||window.webkitAudioContext)();
   await context.resume();const buffer=context.createBuffer(1,count,sampleRate);buffer.copyToChannel(audio,0);
   const source=context.createBufferSource();source.buffer=buffer;source.connect(context.destination);currentSource=source;
   source.onended=()=>{if(currentSource===source)currentSource=null;context.close();};source.start();
 }
 async function speak(text){
   if(!voiceOn||!text)return;
   if(!interacted){pendingSpeech=text;return;}
   try{const response=await fetch('/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
     const result=await response.json();if(result.error)throw new Error(result.error);if(result.provider)$('brainBadge').textContent='BRAIN '+(lastBrainId||'local')+' · VOICE '+result.provider;$('brainBadge').classList.add('visible');await playPcm(result.audio_pcm16,result.sample_rate||24000);
   }catch(e){status('VOICE UNAVAILABLE · '+(e.message||'local Piper failed'));}
 }
 function interaction(){interacted=true;if(pendingSpeech){const p=pendingSpeech;pendingSpeech='';speak(p);}}
 function setBrainBadge(brain,force=false){
   if(!brain||!brain.model_id)return;
   const changed=lastBrainId!==brain.model_id;lastBrainId=brain.model_id;
   $('brainBadge').textContent='BRAIN '+brain.name+' · '+brain.model_name+' · '+(brain.machine||'this machine');
   if(changed||force){$('brainBadge').classList.add('visible');if(brainTimer)clearTimeout(brainTimer);brainTimer=setTimeout(()=>$('brainBadge').classList.remove('visible'),5000);}
 }
 function showNode(node,fly=true){
   if(!node)return;selected=node;
   $('source').innerHTML='';
   const group=document.createElement('div');group.className='group';group.textContent=(node.group||'notes')+' · node '+node.id;
   const title=document.createElement('h2');title.className='title';title.textContent=node.label||'Untitled';
   const excerpt=document.createElement('div');excerpt.className='excerpt';excerpt.textContent=node.excerpt||'No excerpt available.';
   const path=document.createElement('div');path.className='path';path.textContent=node.path||'';
   $('source').append(group,title,excerpt,path);
   if(fly&&graph){const len=Math.hypot(node.x||1,node.y||1,node.z||1)||1;const r=1+180/len;graph.cameraPosition({x:(node.x||0)*r,y:(node.y||0)*r,z:(node.z||0)*r},{x:node.x||0,y:node.y||0,z:node.z||0},1300);}
 }
 function highlight(ids){
   const set=new Set(ids.map(Number));
   graph.nodeColor(n=>n.__pulseUntil>Date.now()?'#fff':set.has(Number(n.id))?'#fff0a8':color(n.group));
   graph.nodeVal(n=>n.__pulseUntil>Date.now()?13:set.has(Number(n.id))?7:3.5);
   graph.linkColor(l=>set.has(Number(l.source?.id??l.source))&&set.has(Number(l.target?.id??l.target))?'rgba(255,230,150,.8)':'rgba(90,180,220,.18)');
   graph.refresh();
 }
 async function addNote(anchorIndex=null,newIndex=null){
   const response=await fetch('/graph?ts='+Date.now());if(!response.ok)throw new Error('Could not refresh graph data.');
   const next=await response.json();
   const oldPositions=new Map(data.nodes.map(n=>[n.id,{x:n.x,y:n.y,z:n.z}]));
   next.nodes.forEach(n=>{const old=oldPositions.get(n.id);if(old){n.x=old.x;n.y=old.y;n.z=old.z;}});
   if(newIndex!==null&&anchorIndex!==null){const anchor=next.nodes.find(n=>n.id===anchorIndex);const born=next.nodes.find(n=>n.id===newIndex);if(anchor&&born){born.x=anchor.x||0;born.y=anchor.y||0;born.z=anchor.z||0;}}
   data=next;graph.graphData(data);$('count').textContent=data.nodes.length+' NOTES INDEXED · '+data.links.length+' CONNECTIONS';
   if(newIndex!==null){const node=data.nodes.find(n=>n.id===newIndex);if(node){node.__pulseUntil=Date.now()+2300;showNode(node,true);highlight([newIndex]);const timer=setInterval(()=>{graph.refresh();if(Date.now()>node.__pulseUntil)clearInterval(timer);},80);}}
 }
 async function reportBrowserResources(){
   const hosts=[...new Set(performance.getEntriesByType('resource').map(entry=>{try{return new URL(entry.name).host;}catch{return '';}}).filter(Boolean))];
   try{await fetch('/network-audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hosts})});}catch{}
 }
 async function ask(text){
   text=(text||$('question').value).trim();if(!text||busy)return;interaction();clearError();busy=true;$('send').disabled=true;status('● thinking…');$('question').value='';
   try{
    if(/^remember that\b/i.test(text)){
      const r=await fetch('/remember',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const result=await r.json();if(result.error)throw new Error(result.error);
      await addNote(result.anchor_node_index??null,result.node_index??null);
      const reply='Consider it filed, sir. My memory has grown another neuron; try not to make a habit of being interesting.';
      $('answer').textContent=reply;await speak(reply);
    }else{
      const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,session_id:sessionId})});const result=await r.json();if(result.error)throw new Error(result.error);
      $('answer').textContent=result.answer||'';if(result.brain)setBrainBadge(result.brain);await speak(result.answer||'');
      const ids=(result.nodes||[]).map(Number);
      if(ids.length>=4){highlight(ids);const top=data.nodes.find(n=>n.id===ids[0]);if(top)showNode(top,false);}
      else if(ids.length){const top=ids[0];const neighbors=data.links.filter(l=>Number(l.source?.id??l.source)===top||Number(l.target?.id??l.target)===top).map(l=>Number(l.source?.id??l.source)===top?(l.target?.id??l.target):(l.source?.id??l.source));highlight([top,...neighbors]);const node=data.nodes.find(n=>n.id===top);if(node)showNode(node,true);}
      else highlight([]);
    }
   }catch(e){error(e.message||'Request failed.');status('● ERROR');}
   finally{await reportBrowserResources();busy=false;$('send').disabled=false;if(!statusText.includes('ERROR'))status('READY · LOCAL WHISPER + VOICE · OFFLINE VIEWER');}
 }
 let micStream=null,micContext=null,micProcessor=null,micInput=null,micFrames=[],recording=false,handsFree=false;
 let autoFrames=[],autoSpeechMs=0,autoSilenceMs=0,autoFinishTimer=null,awaitingWakeCommand=false;
 function resamplePcm(frames,sourceRate,targetRate=16000){
   const total=frames.reduce((sum,frame)=>sum+frame.length,0),joined=new Float32Array(total);let offset=0;
   for(const frame of frames){joined.set(frame,offset);offset+=frame.length;}
   const outputLength=Math.floor(joined.length*targetRate/sourceRate),pcm=new Int16Array(outputLength);
   for(let i=0;i<outputLength;i++){const position=i*sourceRate/targetRate,left=Math.floor(position),fraction=position-left;
     const sample=(joined[left]||0)*(1-fraction)+(joined[Math.min(left+1,joined.length-1)]||0)*fraction;
     pcm[i]=Math.max(-1,Math.min(1,sample))*32767;
   }
   const bytes=new Uint8Array(pcm.buffer);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary);
 }
 async function transcribeFrames(frames,mode='command',sourceRate=null){
   if(!frames.length)return '';
   const audioPcm=resamplePcm(frames,sourceRate||micContext?.sampleRate||48000);
   const response=await fetch('/hear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio_pcm16:audioPcm,mode})});
   const result=await response.json();if(result.error)throw new Error(result.error);return (result.transcript||'').trim();
 }
 async function stopMicrophone(){
   if(autoFinishTimer){clearTimeout(autoFinishTimer);autoFinishTimer=null;}
   if(micProcessor){micProcessor.disconnect();micProcessor.onaudioprocess=null;}
   if(micInput)micInput.disconnect();
   if(micStream)micStream.getTracks().forEach(track=>track.stop());
   if(micContext)await micContext.close();
   micStream=micContext=micProcessor=micInput=null;micFrames=[];autoFrames=[];autoSpeechMs=autoSilenceMs=0;
 }
 async function dispatchHandsFree(frames){
   try{
     if(currentSource){
       const interruptText=await transcribeFrames(frames,'wake');
       if(/\\b(stop|wait)\\b/i.test(interruptText)){try{currentSource.stop();}catch{}currentSource=null;status('SPEECH INTERRUPTED');}
       return;
     }
     if(awaitingWakeCommand){
       awaitingWakeCommand=false;const command=await transcribeFrames(frames,'command');
       if(command)await ask(command);return;
     }
     const wakeText=await transcribeFrames(frames,'wake');
     if(wakeText)status('HEARD · '+wakeText.slice(0,100));
     const wakeMatch=wakeText.match(/^(?:hey\\s+)?jarvis[,.! ]*(.*)$/i);
     if(!wakeMatch)return; // The small model discards speech without the wake word.
     const wakeCommand=(wakeMatch[1]||'').trim();
     if(!wakeCommand){awaitingWakeCommand=true;await speak('Yes, sir?');status('LISTENING FOR YOUR COMMAND');return;}
     const commandText=await transcribeFrames(frames,'command');
     const command=commandText.replace(/^(?:hey\\s+)?jarvis[,.! ]*/i,'').trim()||wakeCommand;
     await ask(command);
   }catch(e){error('Local hearing: '+(e.message||'transcription failed'));status('HEARING ERROR');}
 }
 async function openMicrophone(){
   micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
   micContext=new (window.AudioContext||window.webkitAudioContext)();await micContext.resume();
   micInput=micContext.createMediaStreamSource(micStream);micProcessor=micContext.createScriptProcessor(4096,1,1);
   micProcessor.onaudioprocess=event=>{
     const frame=new Float32Array(event.inputBuffer.getChannelData(0));event.outputBuffer.getChannelData(0).fill(0);
     const duration=frame.length*1000/micContext.sampleRate;
     if(recording){micFrames.push(frame);return;}
     if(!handsFree)return;
     const rms=Math.sqrt(frame.reduce((sum,value)=>sum+value*value,0)/Math.max(1,frame.length));
     const threshold=currentSource?0.045:0.015;
     if(rms>=threshold){
       autoFrames.push(frame);autoSpeechMs+=duration;autoSilenceMs=0;
       if(autoFinishTimer){clearTimeout(autoFinishTimer);autoFinishTimer=null;}
     }else if(autoSpeechMs>0){
       autoFrames.push(frame);autoSilenceMs+=duration;
       if(autoSilenceMs>=700&&!autoFinishTimer){
         autoFinishTimer=setTimeout(async()=>{
           autoFinishTimer=null;const frames=autoFrames;autoFrames=[];const valid=autoSpeechMs>=300;autoSpeechMs=autoSilenceMs=0;
           if(valid)await dispatchHandsFree(frames);
         },900);
       }
     }
   };
   micInput.connect(micProcessor);micProcessor.connect(micContext.destination);
 }
 async function startMic(){
   interaction();if(currentSource){try{currentSource.stop();}catch{}currentSource=null;}
   if(recording){
     recording=false;$('mic').textContent='🎙';status('● TRANSCRIBING LOCALLY…');
     const frames=micFrames;micFrames=[];const sourceRate=micContext?.sampleRate||48000;await stopMicrophone();
     try{const transcript=await transcribeFrames(frames,'command',sourceRate);if(transcript){$('question').value=transcript;await ask(transcript);}else status('NO SPEECH DETECTED · TRY AGAIN');}
     catch(e){error('Local Whisper: '+(e.message||'transcription failed'));status('VOICE ERROR');}
     return;
   }
   try{
     if(handsFree){handsFree=false;$('handsfree').textContent='HANDS FREE OFF';await stopMicrophone();}
     await openMicrophone();recording=true;micFrames=[];$('mic').textContent='■';status('● PUSH TO TALK · LOCAL WHISPER · PRESS ■ TO SEND');
   }catch(e){error('Microphone access: '+(e.message||e.name));status('MICROPHONE UNAVAILABLE');}
 }
 async function toggleHandsFree(){
   interaction();
   if(handsFree){handsFree=false;await stopMicrophone();$('handsfree').textContent='HANDS FREE OFF';status('HANDS-FREE LISTENING OFF');return;}
   if(recording){recording=false;micFrames=[];$('mic').textContent='🎙';}
   try{
     await stopMicrophone();await openMicrophone();handsFree=true;awaitingWakeCommand=false;$('handsfree').textContent='HANDS FREE ON';
     status('● HANDS FREE · SAY “JARVIS” TO WAKE · LOCAL WHISPER');
   }catch(e){handsFree=false;$('handsfree').textContent='HANDS FREE OFF';error('Microphone access: '+(e.message||e.name));status('MICROPHONE UNAVAILABLE');}
 }
 $('ask').addEventListener('submit',e=>{e.preventDefault();ask();});
 $('mic').addEventListener('click',startMic);\n $('handsfree').addEventListener('click',toggleHandsFree);
 $('voiceToggle').addEventListener('click',()=>{interaction();voiceOn=!voiceOn;$('voiceToggle').textContent=voiceOn?'VOICE ON':'VOICE OFF';if(!voiceOn&&currentSource){try{currentSource.stop();}catch{}currentSource=null;}});
 $('reindex').addEventListener('click',async()=>{interaction();status('● THINKING…');try{await addNote();}catch(e){error(e.message);}finally{status('READY · NOTES GROUNDED · LOCAL VIEWER');}});
 document.addEventListener('pointerdown',interaction,{once:true});
 async function boot(){
   if(!window.ForceGraph3D){error('The local 3D graph library is missing. Install the project dependencies and stage viewer/vendor assets.');return;}
   try{
    data=window.__GRAPH__||{nodes:[],links:[]};
    graph=ForceGraph3D()(document.getElementById('galaxy')).backgroundColor('#02040b').showNavInfo(false).nodeId('id').nodeLabel(n=>n.label||'').nodeColor(n=>color(n.group)).nodeVal(3.5).linkColor(()=> 'rgba(90,180,220,.20)').linkOpacity(.34).linkWidth(.55).onNodeClick(n=>{interaction();showNode(n,true);highlight([n.id]);});
    graph.d3Force('charge').strength(-115);graph.d3Force('link').distance(75);graph.d3VelocityDecay(.28);graph.warmupTicks(80);graph.cooldownTime(18000);graph.graphData(data);graph.cameraPosition({x:0,y:0,z:650},{x:0,y:0,z:0},0);
    $('count').textContent=data.nodes.length+' NOTES INDEXED · '+data.links.length+' CONNECTIONS';
    setInterval(()=>graph.d3ReheatSimulation(),12000);
    fetch('/brain').then(r=>r.ok?r.json():null).then(brain=>setBrainBadge(brain,false)).catch(()=>{});\n    if(!muted)speak('Hello, sir.');
    status('READY · NOTES GROUNDED · LOCAL VIEWER');
   }catch(e){error(e.message||'Could not initialise the galaxy.');}
 }
 boot();
})();
</script>
</body>
</html>
