name: A.D.A validation

concurrency:
  group: ada-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/ada-development-assistant-strip
  pull_request:
    branches:
      - main

jobs:
  python-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile backend modules
        run: python -m compileall -q backend build.py server.py
      - name: Run local assistant and workspace tests
        run: python -m pytest -q tests/test_project_manager.py tests/test_assistant_engine.py tests/test_model_runtime.py tests/test_knowledge_base.py tests/test_knowledge_galaxy_build.py tests/test_web_agent.py tests/test_unreal_mcp.py

  frontend-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Electron renderer
        run: npm run build
      - name: Validate standalone viewer JavaScript
        shell: pwsh
        run: |
          $html = Get-Content viewer/index.html -Raw
          $script = [regex]::Match($html, '(?s)<script>\s*(.*?)\s*</script>')
          if (-not $script.Success) { throw "Standalone viewer script was not found." }
          Set-Content -Path viewer-inline-check.js -Value $script.Groups[1].Value -NoNewline
          node --check viewer-inline-check.js
          Remove-Item viewer-inline-check.js
